{% extends "base.html" %}

{% block title %}Log in · Cornerstone{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Log in</h1>
    {% if form.errors %}
        <p class="error">Incorrect username or password.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label for="id_username">Username</label>
            {{ form.username }}
        </div>
        <div class="field">
            <label for="id_password">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn-primary">Log in</button>
    </form>
</div>
{% endblock %}
